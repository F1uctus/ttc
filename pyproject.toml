[project]
name = "ttc"
version = "0.1.0"
description = "A Text-To-Conversation Natural Language Processing toolkit."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  { name = "Ilya Nikitin", email = "ilya.i.nikitin@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
  "click>=8.5.0,<9.0",
  "numpy>=2.5.3,<3.0.0",
  "spacy>=3.8.16,<4.0",
  "ru_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0.tar.gz"
]

[tool.uv.build-backend]
module-name = "ttc"
module-root = "."

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
large_models_ru = [
  "ru_core_news_md @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0.tar.gz",
  "ru_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0.tar.gz"
]
dev = [
  "pytest>=9.1.1",
  "jupyter>=1.1.1",
  "ty>=0.0.85",
  "black>=26.10.0",
  "ruff>=0.16.10",
  "genbadge[coverage]>=1.1.3",
  "coverage-plot @ git+https://github.com/F1uctus/coverage-plot.git",
  "pytest-cov>=7.1.0",
  "onnx>=1.23.2",
  "onnxruntime>=1.30.0",
  "tokenizers>=0.22.2",
]
train = [
  "torch>=2.14.1",
  "transformers>=4.57.6",
  "datasets>=5.0.1",
  "optimum[onnxruntime]>=2.1.0",
  "simalign>=0.4",
  # needed by the MiniLM (XLM-R) tokenizer
  "sentencepiece>=0.2.2",
]

[project.scripts]
ttc = "ttc.cli:cli"

[tool.black]
line-length = 88
# the .py suffix keeps black off data fixtures
include = '/(tests|ttc|train)/.*\.pyi?$'

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Enum members are singletons, not shared mutable state
"ttc/language/russian/token_patterns.py" = ["RUF012"]

[tool.ruff.lint.isort]
# a local datasets/ dir must not make the package first-party
known-third-party = ["datasets"]

[tool.pytest.ini_options]
# adapters/ clones ship their own tests package
testpaths = ["tests"]
markers = ["train: training-stack tests (need the train dependency group)"]
addopts = "-m 'not train'"
