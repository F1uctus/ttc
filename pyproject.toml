[project]
name = "ttc"
version = "0.1.0"
description = "A Text-To-Conversation Natural Language Processing toolkit."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
  { name = "Ilya Nikitin", email = "ilya.i.nikitin@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
  "click>=8.5.0,<9.0",
  "numpy>=2.5.2,<3.0.0",
  "spacy>=3.8.15,<4.0",
  "ru_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0.tar.gz"
]

[tool.uv.build-backend]
module-name = "ttc"
module-root = "."

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
large_models_ru = [
  "ru_core_news_md @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_md-3.8.0/ru_core_news_md-3.8.0.tar.gz",
  "ru_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/ru_core_news_lg-3.8.0/ru_core_news_lg-3.8.0.tar.gz"
]
dev = [
  "pytest>=9.1.1",
  "jupyter>=1.1.1",
  "ty",
  "black>=26.5.1",
  "ruff>=0.16.5",
  "genbadge[coverage]>=1.1.3",
  "coverage-plot @ git+https://github.com/F1uctus/coverage-plot.git",
  "pytest-cov>=7.1.0",
]

[project.scripts]
ttc = "ttc.cli:cli"

[tool.black]
line-length = 88
# Must keep the `.py` suffix: `include` replaces Black's default file filter,
# so a bare directory pattern also matches the JSON/CSV/text corpus fixtures
# under tests/ and rewrites them as if they were Python.
include = '/(tests|ttc)/.*\.pyi?$'

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# The flagged attributes are Enum members holding spaCy token patterns, not
# shared mutable state: Enum members are singletons, so RUF012's rationale
# does not apply, and its suggested `ClassVar` annotation would tell type
# checkers these are not members at all.
"ttc/language/russian/token_patterns.py" = ["RUF012"]
