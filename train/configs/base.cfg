[encoder]
checkpoint = "microsoft/Multilingual-MiniLM-L12-H384"
dim = 384
window = 256
stride = 192

[heads]
hidden = 128

[mixing]
temperature = 0.5

[training]
seed = 20260704
lr = 0.00003
batch_size = 16
steps = 20000
device = "auto"

[data]
examples_dir = "build/examples"

[stages]
order = ["pretrain_nonru", "distant_ru", "finetune_ru"]

[stages.pretrain_nonru]
sources = ["pdnc", "riqua", "quoteli3", "jy_quoteplus", "droc", "rusdracor"]
steps = 20000

[stages.distant_ru]
sources = ["distant"]
steps = 5000
optional = true

[stages.finetune_ru]
sources = ["projected", "silver_llm", "native"]
steps = 3000
